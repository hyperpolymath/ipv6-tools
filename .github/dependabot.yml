# Dependabot configuration for hyperpolymath/ipv6-tools

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Rust/Cargo workspace in /ipv6-only
  - package-ecosystem: "cargo"
    directory: "/ipv6-only"
    schedule:
      interval: "weekly"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Nix flakes
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
