name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write
jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@a9a3281d620bdd195369c9a6f0bc1d661910965a
    # Job-level permissions REPLACE the workflow-level block for the called
    # reusable, so they must be a superset of what every job inside it asks
    # for. scorecard-reusable >= standards@a423e48a (#788) requests `actions: read`;
    # omitting it here is a startup_failure (zero jobs, no error text).
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
