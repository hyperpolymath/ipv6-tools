# IPv6-Site-Enforcer — Service Configuration (ConfigMap).
#
# This manifest defines the operational parameters for the NAT64/DNS64 
# gateway. It provides the authoritative translation prefix and the 
# Unbound recursive resolver configuration.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ipv6-enforcer-config
  namespace: ipv6-enforcer
data:
  # PREFIX: The standard "Well-Known Prefix" for NAT64 (RFC 6052).
  nat64-prefix: "64:ff9b::/96"

  # RESOLVER CONFIG: The embedded script for the Unbound container.
  unbound.conf: |
    server:
      # DNS64 SYNTHESIS: Configures Unbound to map IPv4 A-records into 
      # the 64:ff9b::/96 prefix, creating synthetic AAAA records.
      module-config: "dns64 validator iterator"
      dns64-prefix: 64:ff9b::/96
      dns64-synthall: yes

      # SECURITY: Restrict access to the internal cluster network.
      access-control: 0.0.0.0/0 allow
      access-control: ::/0 allow

    # UPSTREAM: Forwards unknown queries to the public DNS64 resolvers.
    forward-zone:
      name: "."
      forward-addr: 2606:4700:4700::1111 # Cloudflare IPv6
