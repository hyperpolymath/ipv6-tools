# IPv6-Site-Enforcer — Sidecar Deployment Manifest.
#
# This manifest implements the NAT64/DNS64 gateway as a high-availability 
# Kubernetes deployment. It uses a "Sidecar" pattern where the translation 
//! engine and the synthesis server coexist in the same pod.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipv6-site-enforcer
  namespace: ipv6-enforcer
spec:
  replicas: 2 # Redundancy for critical network path.
  selector:
    matchLabels:
      app.kubernetes.io/name: ipv6-site-enforcer
  template:
    spec:
      containers:
        # 1. JOOL-NAT64: The kernel-level translation engine.
        - name: jool-nat64
          image: ghcr.io/hyperpolymath/jool-nat64:latest
          securityContext:
            capabilities:
              # PRIVILEGE: Required for low-level packet manipulation.
              add: ["NET_ADMIN", "NET_RAW"]
          env:
            - name: NAT64_PREFIX
              valueFrom:
                configMapKeyRef: { name: ipv6-enforcer-config, key: nat64-prefix }

        # 2. UNBOUND-DNS64: Synthetic AAAA record generator.
        - name: unbound-dns64
          image: mvance/unbound:latest
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
